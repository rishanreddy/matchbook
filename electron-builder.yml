appId: com.frc.matchbook
productName: Matchbook
copyright: Copyright © 2024

directories:
  output: release
  buildResources: build

files:
  - '!**/.vscode/*'
  - '!src/**'
  - '!.github/**'
  - '!.opencode/**'
  - '!docs/**'
  - '!release/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.js,eslint.config.mjs,CHANGELOG.md,README.md,AGENTS.md,SECURITY.md,SUPPORT.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,pnpm-workspace.yaml,.editorconfig,.prettierignore,.prettierrc,.prettierrc.yaml}'
  - '!{postcss.config.cjs,tailwind.config.cjs,tsconfig.json,tsconfig.node.json,tsconfig.web.json}'

asarUnpack:
  - resources/**

win:
  target:
    - nsis
  icon: build/icon.ico
  artifactName: ${productName}-${version}-Setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  runAfterFinish: true
  license: LICENSE
  installerHeader: build/installer-welcome.bmp

mac:
  target:
    # A universal app includes both Intel (x64) and Apple Silicon (arm64) code.
    # Keeping this in the packaging config—not just CI—also makes local `build:mac`
    # output installable on every supported Mac.
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal
  icon: build/icon.icns
  category: public.app-category.productivity
  # The hardened runtime blocks camera access unless the app is entitled for it.
  # The QR scanner needs the camera, so both files are supplied explicitly.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  extendInfo:
    NSCameraUsageDescription: Matchbook uses the camera only when you choose to scan a QR code.

linux:
  target:
    - AppImage
  icon: build/icon.png
  category: Utility

publish:
  provider: github
  owner: rishanreddy
  repo: matchbook
  releaseType: release
