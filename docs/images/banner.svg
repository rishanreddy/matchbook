<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Matchbook — offline match scouting for FRC teams">
  <rect width="1200" height="300" fill="#0e1116"/>
  <rect x="0" y="0" width="1200" height="2" fill="#ffb020"/>

  <!-- The mark: a matchbook cover holding three matches above an amber strike strip. -->
  <g transform="translate(96 78) scale(4.5)">
    <rect x="5" y="2.5" width="22" height="27" rx="3.5" fill="#161b22" stroke="#eef1f5" stroke-width="2"/>
    <path d="M6 23.5h20" stroke="#ffb020" stroke-width="4.2"/>
    <g stroke="#eef1f5" stroke-width="2.1" stroke-linecap="round">
      <path d="M10.8 20.5v-9"/><path d="M16 20.5v-9"/><path d="M21.2 20.5v-9"/>
    </g>
    <g fill="#eef1f5">
      <circle cx="10.8" cy="9.6" r="1.85"/><circle cx="16" cy="9.6" r="1.85"/><circle cx="21.2" cy="9.6" r="1.85"/>
    </g>
  </g>

  <g font-family="'IBM Plex Sans','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="272" y="140" fill="#eef1f5" font-size="64" font-weight="600" letter-spacing="-1.2">Matchbook</text>
    <text x="275" y="182" fill="#a7b0bd" font-size="23">Offline match scouting for FRC teams</text>
    <text x="275" y="228" fill="#828c9a" font-size="17">Collect from every scout laptop &#183; rank teams for alliance selection &#183; no internet required</text>
  </g>
</svg>
